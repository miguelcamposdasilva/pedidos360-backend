services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
